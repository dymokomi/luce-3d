name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-3d
      - name: Read compiler pins
        id: pins
        run: |
          echo "base=$(cat luce-3d/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(cat luce-3d/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
          echo "ui=$(cat luce-3d/bootstrap/UI)" >> "$GITHUB_OUTPUT"
          echo "color=$(cat luce-3d/bootstrap/COLOR)" >> "$GITHUB_OUTPUT"
          echo "svg=$(cat luce-3d/bootstrap/SVG)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - name: Check out the pinned library packages
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          while read -r name revision; do
            revision=${revision%$'\r'}
            [ -n "$name" ] || continue
            git init -q "$name"
            git -C "$name" fetch -q --depth 1 "https://github.com/dymokomi/$name.git" "$revision"
            git -C "$name" checkout -q --detach FETCH_HEAD
          done < luce-3d/bootstrap/PACKAGES
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-ui
          ref: ${{ steps.pins.outputs.ui }}
          path: luce-ui
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-color, ref: "${{ steps.pins.outputs.color }}", path: luce-color}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-svg, ref: "${{ steps.pins.outputs.svg }}", path: luce-svg}
      - name: Install Linux font backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev fonts-dejavu-core
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Build native compilers
        run: |
          (cd luce-base && ./build.sh)
          (cd luce && LUCE_BASE_COMPILER=../luce-base/build/luce-base ./build.sh)
      - name: Portable ownership and interop tests
        working-directory: luce-3d
        run: |
          ./test.sh
          python3 tests/docs.py
      - name: Metal pixel tests
        if: runner.os == 'macOS'
        working-directory: luce-3d
        run: python3 tests/gpu.py
