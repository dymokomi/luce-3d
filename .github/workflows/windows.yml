name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-3d
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python luce-base/tools/checkout_main.py luce-3d luce
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-vulkan-loader
      - name: Configure native library search
        shell: msys2 {0}
        run: echo "LIBRARY_PATH=$(cygpath -m /ucrt64/lib)" >> "$GITHUB_ENV"
      - name: Verify Vulkan loader
        shell: msys2 {0}
        run: |
          test -f /ucrt64/lib/libvulkan-1.dll.a
          test "$(gcc -print-file-name=libvulkan-1.dll.a)" != "libvulkan-1.dll.a"
      - name: Build Base
        working-directory: luce-base
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Build Luce
        working-directory: luce
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Run Windows contracts
        working-directory: luce-3d
        shell: msys2 {0}
        run: python tests/run.py
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-3d-windows-${{ github.sha }}
          path: |
            luce-3d/build/*.log
            luce-3d/build/*results.json
