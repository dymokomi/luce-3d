name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-3d
      - name: Read dependency pins
        id: pins
        shell: pwsh
        run: |
          "base=$(Get-Content luce-3d/bootstrap/BASE)" >> $env:GITHUB_OUTPUT
          "luce=$(Get-Content luce-3d/bootstrap/LUCE)" >> $env:GITHUB_OUTPUT
          "ui=$(Get-Content luce-3d/bootstrap/UI)" >> $env:GITHUB_OUTPUT
          "color=$(Get-Content luce-3d/bootstrap/COLOR)" >> $env:GITHUB_OUTPUT
          "svg=$(Get-Content luce-3d/bootstrap/SVG)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-ui
          ref: ${{ steps.pins.outputs.ui }}
          path: luce-ui
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-color
          ref: ${{ steps.pins.outputs.color }}
          path: luce-color
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-svg
          ref: ${{ steps.pins.outputs.svg }}
          path: luce-svg
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-vulkan-devel
      - name: Build Base
        working-directory: luce-base
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Build Luce
        working-directory: luce
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Run Windows contracts
        working-directory: luce-3d
        shell: msys2 {0}
        run: python tests/run.py
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-3d-windows-${{ github.sha }}
          path: |
            luce-3d/build/*.log
            luce-3d/build/*results.json
